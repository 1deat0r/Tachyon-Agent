[package]
name = "tachyon-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
# CreateTask idempotency (issue #57 ticket 01): deterministic BLAKE3
# fingerprint over the canonical request identity; already in the tree.
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tachyon-core = { workspace = true }
# M11 plan items 5-6 (writer C): the gateway validates/pins the workspace
# root, builds the policy ToolsContext, resolves the acceptance contract,
# and spawns the shared driver with a configured model provider — these
# neutral workspace crates are the same ones tachyon-core already uses.
tachyon-models = { version = "1.0.0", path = "../tachyon-models" }
tachyon-policy = { version = "1.0.0", path = "../tachyon-policy" }
tachyon-protocol = { workspace = true }
# Deterministic `Query` (handoff priority 2): classify with the router,
# answer from a fresh repository index — never a provider.
tachyon-repo = { version = "1.0.0", path = "../tachyon-repo" }
tachyon-router = { version = "1.0.0", path = "../tachyon-router" }
tachyon-store = { workspace = true }
tachyon-tools = { version = "1.0.0", path = "../tachyon-tools" }
tachyon-types = { workspace = true }
tachyon-verify = { version = "1.0.0", path = "../tachyon-verify" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# G5 e2e arms a scripted provider exactly like the bench_matrix example
# (base_hash over the scratch fixture) and the in-flight StartRun test
# drives a deliberately blocking provider through the ModelProvider trait.
async-trait = { workspace = true }
tachyon-mutation = { version = "1.0.0", path = "../tachyon-mutation" }

[lints]
workspace = true
