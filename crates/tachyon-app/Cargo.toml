[package]
name = "tachyon-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tachyon-gateway = { workspace = true }
# M11 item 5: the gateway process builds its model provider from the
# same FileConfig the CLI reads; these workspace crates hold the neutral
# provider trait impls and the redaction registry the key registers with.
tachyon-models = { version = "0.0.1", path = "../tachyon-models" }
tachyon-protocol = { workspace = true }
# `tachyon attach` wires the frozen TUI entrypoint (writer B crate).
tachyon-tui = { path = "../tachyon-tui" }
tachyon-tools = { version = "0.0.1", path = "../tachyon-tools" }
tachyon-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Wire-key rotation test (acp-env-secrets ticket 03): the config test
# module implements `tachyon_models::HttpTransport` — an #[async_trait]
# trait — with a recording transport; already a workspace dependency.
async-trait = { workspace = true }

[lints]
workspace = true
