[workspace]
resolver = "2"
members = [
    "crates/tachyon-types",
    "crates/tachyon-protocol",
    "crates/tachyon-ir",
    "crates/tachyon-intent",
    "crates/tachyon-store",
    "crates/tachyon-policy",
    "crates/tachyon-tools",
    "crates/tachyon-repo",
    "crates/tachyon-retrieval",
    "crates/tachyon-models",
    "crates/tachyon-judgment",
    "crates/tachyon-mutation",
    "crates/tachyon-router",
    "crates/tachyon-scheduler",
    "crates/tachyon-verify",
    "crates/tachyon-telemetry",
    "crates/tachyon-core",
    "crates/tachyon-gateway",
    "crates/tachyon-tui",
    "crates/tachyon-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
authors = ["Tachyon contributors"]
description = "High-performance AI agent harness: deterministic execution first, LLM reasoning only for unresolved uncertainty"
repository = "https://github.com/1deat0r/Tachyon-Agent"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["agent", "ai", "cli", "scheduler", "runtime"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29"
dashmap = "6"
futures-util = "0.3"
notify = "8"
parking_lot = "0.12"
proptest = "1"
ratatui = "0.30.2"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tachyon-core = { version = "0.0.1", path = "crates/tachyon-core" }
tachyon-gateway = { version = "0.0.1", path = "crates/tachyon-gateway" }
tachyon-ir = { version = "0.0.1", path = "crates/tachyon-ir" }
tachyon-protocol = { version = "0.0.1", path = "crates/tachyon-protocol" }
tachyon-store = { version = "0.0.1", path = "crates/tachyon-store" }
tachyon-types = { version = "0.0.1", path = "crates/tachyon-types" }
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
