name: acceptance

# Full local verification, off the PR path. The shared `cargo verify full`
# entry point adds the security/recovery suites, fixture self-check, spec §44
# matrix, and release performance gate to the normal VERIFY checks. Run on a
# schedule or manually when a task changes these acceptance areas.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Full local verification
        run: cargo verify full
        env:
          M14_SAMPLES: "10"
